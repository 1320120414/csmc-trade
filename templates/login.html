{% extends "base.html" %}
{% block title %}登录 - {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="form-card">
  <h1>登录</h1>
  <form method="post" action="{{ url_for('login') }}">
    <div class="form-group">
      <label>QQ号 / 游戏ID <span class="req">*</span></label>
      <input type="text" name="account" placeholder="输入QQ号或游戏ID" required autofocus>
    </div>
    <div class="form-group">
      <label>密码 <span class="req">*</span></label>
      <input type="password" name="password" placeholder="输入密码" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">登录</button>
      <a href="{{ url_for('register') }}" class="btn btn-ghost">没有账号？注册</a>
    </div>
    <p class="hint" style="margin-top:16px">忘记密码请联系管理员重置。</p>
  </form>
</div>
{% endblock %}
