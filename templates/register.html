{% extends "base.html" %}
{% block title %}注册 - {{ PLATFORM_NAME }}{% endblock %}
{% block content %}
<div class="form-card">
  <h1>注册账号</h1>
  <form method="post" action="{{ url_for('register') }}">
    <div class="form-group">
      <label>QQ号 <span class="req">*</span></label>
      <input type="text" name="qq" placeholder="纯数字QQ号" required pattern="[0-9]+" autofocus>
      <div class="hint">用于交易时对方联系你</div>
    </div>
    <div class="form-group">
      <label>游戏ID <span class="req">*</span></label>
      <input type="text" name="game_id" placeholder="CSMC 服务器内的游戏名字" required>
      <div class="hint">注册后不可修改</div>
    </div>
    <div class="form-group">
      <label>密码 <span class="req">*</span></label>
      <input type="password" name="password" placeholder="至少6位" required minlength="6">
    </div>
    <div class="form-group">
      <label>确认密码 <span class="req">*</span></label>
      <input type="password" name="password2" placeholder="再次输入密码" required minlength="6">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">注册</button>
      <a href="{{ url_for('login') }}" class="btn btn-ghost">已有账号？登录</a>
    </div>
    {% if REQUIRE_APPROVAL %}
    <p class="hint" style="margin-top:16px">注册后需等待管理员审核通过方可登录。</p>
    {% endif %}
  </form>
</div>
{% endblock %}
